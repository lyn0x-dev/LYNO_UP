<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0820"/>
      <stop offset="0.55" stop-color="#150d3a"/>
      <stop offset="1" stop-color="#06141f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow1)"/>
    <rect width="1200" height="340" fill="url(#glow2)"/>

    <!-- floating orbs -->
    <circle cx="140" cy="80" r="4" fill="#a78bfa">
      <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="70" r="3" fill="#34d399">
      <animate attributeName="cy" values="70;95;70" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="270" r="5" fill="#60a5fa">
      <animate attributeName="cy" values="270;250;270" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="270" r="3" fill="#f472b6">
      <animate attributeName="cy" values="270;290;270" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- left: title -->
    <g font-family="'Segoe UI','Inter',Arial,sans-serif">
      <text x="70" y="150" font-size="104" font-weight="900" fill="url(#title)" letter-spacing="4">LYNO UP</text>
      <text x="74" y="200" font-size="26" fill="#c7d2fe" font-weight="500" letter-spacing="1">Node.js Bot Hosting Panel</text>
      <text x="74" y="244" font-size="26" fill="#94a3b8" direction="rtl" unicode-bidi="bidi-override" text-anchor="start">لوحة استضافة بوتات متعددة المستخدمين</text>

      <!-- pills -->
      <g font-size="15" font-weight="600">
        <rect x="74" y="270" width="118" height="32" rx="16" fill="#7c3aed" fill-opacity="0.25" stroke="#a78bfa" stroke-opacity="0.6"/>
        <text x="133" y="291" fill="#ddd6fe" text-anchor="middle">Multi-User</text>
        <rect x="204" y="270" width="118" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.2" stroke="#60a5fa" stroke-opacity="0.6"/>
        <text x="263" y="291" fill="#bae6fd" text-anchor="middle">Live Console</text>
        <rect x="334" y="270" width="118" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.6"/>
        <text x="393" y="291" fill="#a7f3d0" text-anchor="middle">Telegram</text>
      </g>
    </g>

    <!-- right: terminal window -->
    <g transform="translate(700 60)">
      <rect width="440" height="220" rx="14" fill="#0a0a1a" fill-opacity="0.85" stroke="#6366f1" stroke-opacity="0.5"/>
      <rect width="440" height="38" rx="14" fill="#1e1b4b" fill-opacity="0.9"/>
      <rect y="24" width="440" height="14" fill="#1e1b4b" fill-opacity="0.9"/>
      <circle cx="24" cy="19" r="6" fill="#ef4444"/>
      <circle cx="46" cy="19" r="6" fill="#f59e0b"/>
      <circle cx="68" cy="19" r="6" fill="#22c55e"/>
      <text x="220" y="24" font-family="Consolas,monospace" font-size="13" fill="#818cf8" text-anchor="middle">lyno-up ~ console</text>

      <g font-family="Consolas,'Courier New',monospace" font-size="15">
        <text x="22" y="72" fill="#34d399">$ npm start</text>
        <text x="22" y="98" fill="#94a3b8">✔ Panel listening on 0.0.0.0:24691</text>
        <text x="22" y="122" fill="#94a3b8">✔ Telegram bot connected</text>
        <text x="22" y="146" fill="#60a5fa">▶ server "my-bot" started</text>
        <text x="22" y="170" fill="#c4b5fd">  CPU 3%  ·  RAM 84 MB</text>
        <text x="22" y="198" fill="#34d399">$</text>
        <rect x="38" y="184" width="9" height="18" fill="#a78bfa">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- border -->
    <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="url(#title)" stroke-opacity="0.55" stroke-width="2"/>
  </g>
</svg>
