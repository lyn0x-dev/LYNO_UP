<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070514"/>
      <stop offset="0.5" stop-color="#110a33"/>
      <stop offset="1" stop-color="#04111c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.45" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="brandV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.12" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.92" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.55" cy="0.05" r="0.4">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity="0.09"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="400" rx="26"/></clipPath>
    <clipPath id="barClip1"><rect x="0" y="0" width="196" height="8" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <rect width="1200" height="400" fill="url(#orbA)"/>
    <rect width="1200" height="400" fill="url(#orbB)"/>
    <rect width="1200" height="400" fill="url(#orbC)"/>

    <!-- slow rotating ring behind title -->
    <g transform="translate(300 200)" opacity="0.5">
      <circle r="170" fill="none" stroke="#8b5cf6" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      </circle>
      <circle r="130" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2 12">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="45s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="110" cy="60" r="1.6"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="46" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="90" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="48" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="356" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="330" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="350" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ============ LEFT: BRAND ============ -->
    <g font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">

      <!-- logo mark -->
      <g transform="translate(74 70)" filter="url(#glow)">
        <path d="M30 0 L56 15 V45 L30 60 L4 45 V15 Z" fill="#0f0b2e" stroke="url(#brandV)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M30 14 L30 40 M19 26 L30 14 L41 26" fill="none" stroke="url(#brand)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="stroke-dashoffset" values="0;0" dur="1s" repeatCount="indefinite"/>
        </path>
        <rect x="21" y="44" width="18" height="3.5" rx="1.75" fill="url(#brand)"/>
      </g>
      <text x="150" y="98" font-size="15" font-weight="700" fill="#a5b4fc" letter-spacing="5">BOT HOSTING PANEL</text>

      <!-- title -->
      <text x="70" y="212" font-size="118" font-weight="900" fill="url(#brand)" letter-spacing="3" filter="url(#glow)">LYNO UP</text>
      <text x="70" y="212" font-size="118" font-weight="900" fill="url(#brand)" letter-spacing="3">LYNO UP</text>

      <!-- shine sweep over title -->
      <g clip-path="url(#round)">
        <rect x="-300" y="110" width="220" height="130" fill="url(#sweep)" opacity="0.22" transform="skewX(-20)">
          <animate attributeName="x" values="-300;900;900" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- underline -->
      <rect x="74" y="230" width="150" height="4" rx="2" fill="url(#brand)"/>
      <rect x="232" y="230" width="22" height="4" rx="2" fill="#34d399" fill-opacity="0.7"/>
      <rect x="262" y="230" width="8" height="4" rx="2" fill="#34d399" fill-opacity="0.4"/>

      <!-- tagline -->
      <text x="74" y="276" font-size="27" font-weight="500" fill="#e0e7ff">استضف بوتاتك بسهولة. تحكّم في كل شيء.</text>
      <text x="74" y="308" font-size="17" fill="#94a3b8" letter-spacing="0.5">Multi-user · Live console · File manager · Telegram control</text>

      <!-- pills -->
      <g font-size="14" font-weight="700">
        <g transform="translate(74 334)">
          <rect width="104" height="32" rx="16" fill="#7c3aed" fill-opacity="0.2" stroke="#a78bfa" stroke-opacity="0.7"/>
          <circle cx="20" cy="16" r="4" fill="#a78bfa"/>
          <text x="32" y="21" fill="#ddd6fe">Node.js</text>
        </g>
        <g transform="translate(190 334)">
          <rect width="124" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.7"/>
          <circle cx="20" cy="16" r="4" fill="#38bdf8"/>
          <text x="32" y="21" fill="#bae6fd">WebSocket</text>
        </g>
        <g transform="translate(326 334)">
          <rect width="116" height="32" rx="16" fill="#10b981" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.7"/>
          <circle cx="20" cy="16" r="4" fill="#34d399"/>
          <text x="32" y="21" fill="#a7f3d0">Telegram</text>
        </g>
        <g transform="translate(454 334)">
          <rect width="96" height="32" rx="16" fill="#ec4899" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.7"/>
          <circle cx="20" cy="16" r="4" fill="#f472b6"/>
          <text x="32" y="21" fill="#fbcfe8">Secure</text>
        </g>
      </g>
    </g>

    <!-- ============ RIGHT: DASHBOARD CARDS ============ -->
    <g font-family="'Segoe UI','Inter',Arial,sans-serif">

      <!-- server card (back) -->
      <g transform="translate(790 46)" filter="url(#shadow)">
        <animateTransform attributeName="transform" type="translate" values="790 46;790 38;790 46" dur="7s" repeatCount="indefinite"/>
        <rect width="330" height="170" rx="18" fill="url(#glass)" stroke="#6366f1" stroke-opacity="0.45"/>
        <rect x="1" y="1" width="328" height="1.5" rx="1" fill="url(#brand)" opacity="0.6"/>

        <!-- header -->
        <rect x="20" y="20" width="36" height="36" rx="10" fill="#4c1d95" fill-opacity="0.6" stroke="#a78bfa" stroke-opacity="0.5"/>
        <text x="38" y="45" font-size="18" text-anchor="middle">🤖</text>
        <text x="68" y="35" font-size="16" font-weight="700" fill="#f1f5f9">my-discord-bot</text>
        <text x="68" y="52" font-size="12" fill="#94a3b8">index.js · Node 20</text>

        <!-- status -->
        <g transform="translate(236 24)">
          <rect width="76" height="26" rx="13" fill="#052e1b" stroke="#22c55e" stroke-opacity="0.6"/>
          <circle cx="16" cy="13" r="4.5" fill="#22c55e">
            <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
          </circle>
          <text x="28" y="17.5" font-size="12" font-weight="700" fill="#86efac">Running</text>
        </g>

        <!-- CPU -->
        <text x="20" y="88" font-size="12" font-weight="600" fill="#94a3b8">CPU</text>
        <text x="310" y="88" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="end">
          <tspan>12%</tspan>
        </text>
        <rect x="20" y="95" width="290" height="8" rx="4" fill="#1e293b"/>
        <rect x="20" y="95" width="60" height="8" rx="4" fill="url(#bar)">
          <animate attributeName="width" values="40;110;70;40" dur="6s" repeatCount="indefinite"/>
        </rect>

        <!-- RAM -->
        <text x="20" y="126" font-size="12" font-weight="600" fill="#94a3b8">RAM</text>
        <text x="310" y="126" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="end">84 / 256 MB</text>
        <rect x="20" y="133" width="290" height="8" rx="4" fill="#1e293b"/>
        <rect x="20" y="133" width="96" height="8" rx="4" fill="url(#bar)">
          <animate attributeName="width" values="90;120;100;90" dur="8s" repeatCount="indefinite"/>
        </rect>

        <!-- uptime -->
        <text x="20" y="160" font-size="11" fill="#64748b">Uptime 3d 14h · Auto-restart ON</text>
      </g>

      <!-- terminal card (front) -->
      <g transform="translate(740 190)" filter="url(#shadow)">
        <animateTransform attributeName="transform" type="translate" values="740 190;740 198;740 190" dur="6s" repeatCount="indefinite"/>
        <rect width="380" height="176" rx="16" fill="#080813" fill-opacity="0.92" stroke="#8b5cf6" stroke-opacity="0.5"/>
        <path d="M0 16 Q0 0 16 0 H364 Q380 0 380 16 V36 H0 Z" fill="#1b1744"/>
        <circle cx="22" cy="18" r="5.5" fill="#ef4444"/>
        <circle cx="42" cy="18" r="5.5" fill="#f59e0b"/>
        <circle cx="62" cy="18" r="5.5" fill="#22c55e"/>
        <text x="190" y="22" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#818cf8" text-anchor="middle">console — my-discord-bot</text>

        <g font-family="Consolas,'Courier New',monospace" font-size="13.5">
          <text x="20" y="64" fill="#34d399">$ npm start</text>
          <text x="20" y="86" fill="#64748b">[12:04:11] <tspan fill="#94a3b8">Logging in to Discord…</tspan></text>
          <text x="20" y="108" fill="#64748b">[12:04:13] <tspan fill="#60a5fa">✔ Bot online · 42 guilds</tspan></text>
          <text x="20" y="130" fill="#64748b">[12:04:20] <tspan fill="#c4b5fd">▶ /ping handled in 18ms</tspan></text>
          <text x="20" y="156" fill="#34d399">$</text>
          <rect x="34" y="143" width="8" height="16" fill="#a78bfa">
            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>

      <!-- mini sparkline chip -->
      <g transform="translate(1000 330)">
        <animateTransform attributeName="transform" type="translate" values="1000 330;1000 324;1000 330" dur="5s" repeatCount="indefinite"/>
        <rect width="150" height="46" rx="12" fill="url(#glass)" stroke="#22d3ee" stroke-opacity="0.4"/>
        <path d="M14 34 L30 26 L46 30 L62 18 L78 24 L94 12 L110 20 L126 10 L126 38 L14 38 Z" fill="url(#area)"/>
        <path d="M14 34 L30 26 L46 30 L62 18 L78 24 L94 12 L110 20 L126 10" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="d"
            values="M14 34 L30 26 L46 30 L62 18 L78 24 L94 12 L110 20 L126 10;
                    M14 30 L30 32 L46 22 L62 26 L78 14 L94 22 L110 12 L126 18;
                    M14 34 L30 26 L46 30 L62 18 L78 24 L94 12 L110 20 L126 10"
            dur="5s" repeatCount="indefinite"/>
        </path>
        <circle cx="136" cy="23" r="4" fill="#22d3ee"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- moving light along the bottom edge -->
    <rect x="0" y="397" width="1200" height="3" fill="url(#brand)" opacity="0.35"/>
    <rect x="-200" y="396" width="200" height="4" fill="url(#sweep)">
      <animate attributeName="x" values="-200;1200" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- border -->
    <rect x="1.5" y="1.5" width="1197" height="397" rx="25" fill="none" stroke="url(#brand)" stroke-opacity="0.6" stroke-width="2"/>
  </g>
</svg>
